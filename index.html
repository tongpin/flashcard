<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ជីវវិទ្យា ២០២៦ - BaccII Revision</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">

  <!-- Navigation Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <h2>🧬 ជីវវិទ្យា ២០២៦</h2>
    </div>
    <nav class="nav-links">
      <a href="#" class="active">🎡 Spin Wheel</a>
      <a href="#">🎴 Flashcards</a>
    </nav>
  </aside>

  <!-- Main Content Area -->
  <main class="main-content">
    
    <!-- Header Area -->
    <header class="app-header">
      <!-- Progress Bar Container -->
      <div class="progress-container">
        <div class="progress-labels">
          <span>ការរីកចម្រើន:</span>
          <span id="progress-percent">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
      </div>

      <!-- Theme Switch Button -->
      <button id="theme-toggle-btn" class="theme-btn">
        🌙 Dark Mode
      </button>
    </header>

    <!-- Interactive Section -->
    <section class="interactive-container">
      <h1>រំលឹកមេរៀនជីវវិទ្យា</h1>
      
      <!-- Spin / Flashcard Action Controls -->
      <div class="controls">
        <button id="spin-btn" class="action-btn">Spin Wheel 🎡</button>
        <button id="flip-btn" class="action-btn">Flip Flashcard 🎴</button>
      </div>

      <!-- Result / Question Display -->
      <div class="card-display" id="question-card">
        <p id="card-text">ចុចប៊ូតុងខាងលើដើម្បីចាប់ផ្តើម!</p>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
