<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ជីវវិទ្យា ២០២៦ - BaccII Revision</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">

  <!-- Navigation Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <h2>🧬 ជីវវិទ្យា ២០២៦</h2>
    </div>
    <nav class="nav-links">
      <a href="#spin-section" class="active">🎡 Spin Wheel</a>
      <a href="#flashcard-section">🎴 Flashcards</a>
    </nav>
  </aside>

  <!-- Main Content Area -->
  <main class="main-content">
    
    <!-- Top Header -->
    <header class="app-header">
      <div class="progress-container">
        <div class="progress-labels">
          <span>ការរីកចម្រើន:</span>
          <span id="progress-percent">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
      </div>

      <button id="theme-toggle-btn" class="theme-btn">🌙 Dark Mode</button>
    </header>

    <!-- Spin Wheel Section -->
    <section id="spin-section" class="interactive-container">
      <h1>🎡 វិលកង់រំលឹកមេរៀន (Spin Wheel)</h1>
      <div class="controls">
        <button id="spin-btn" class="action-btn">Spin Wheel 🎡</button>
        <button id="flip-btn" class="action-btn">Flip Answer 🎴</button>
      </div>
      <div class="card-display" id="question-card">
        <p id="card-text">ចុចប៊ូតុង Spin Wheel ខាងលើដើម្បីចាប់ផ្តើម!</p>
      </div>
    </section>

    <hr class="divider">

    <!-- Flashcards Grid Section -->
    <section id="flashcard-section" class="flashcard-section">
      <h2>🎴 Flashcards ជីវវិទ្យា (៦៤ សំណួរ)</h2>
      <p class="subtitle">ចុចលើកាតនីមួយៗដើម្បីមើលចម្លើយ!</p>
      
      <div class="flashcards-grid" id="flashcards-container"></div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
